[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlzero-agentic-automl"
version = "0.1.0"
description = "A Multi-Agent System for End-to-end Machine Learning Automation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    {name = "Lead Architect", email = "architect@example.com"}
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "gradio>=3.0.0",
    "httpx>=0.24.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
mlzero = "mlzero.cli:main"

[tool.setuptools.packages.find]
include = ["mlzero*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mlzero --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
