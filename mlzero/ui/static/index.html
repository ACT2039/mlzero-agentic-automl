<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLZero — Agentic AutoML</title>
  <link rel="icon" type="image/png" href="/static/assets/logo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    /* ── Glassmorphism Design Tokens ───────────────────────────────────────── */
    :root {
      --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg-gradient: radial-gradient(circle at 6% 18%, rgba(0, 113, 227, 0.28), transparent 42%),
                     radial-gradient(circle at 10% 75%, rgba(138, 43, 226, 0.25), transparent 45%),
                     radial-gradient(circle at 85% 15%, rgba(138, 43, 226, 0.24), transparent 45%),
                     radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.20), transparent 50%),
                     radial-gradient(circle at 50% 50%, rgba(255, 59, 119, 0.10), transparent 50%),
                     linear-gradient(135deg, #07090e 0%, #0d111d 35%, #151128 70%, #201133 100%);
      --bg:          #07090e;
      --surface:     rgba(255, 255, 255, 0.05);
      --elevated:    rgba(255, 255, 255, 0.09);
      --border:      rgba(255, 255, 255, 0.16);
      --border-light: rgba(255, 255, 255, 0.24);
      --primary:     #0071e3;
      --primary-d:   #005bb5;
      --primary-glow: rgba(0, 113, 227, 0.45);
      --secondary:   #00f2fe;
      --success:     #28C76F;
      --warning:     #F5B940;
      --error:       #EF5B67;
      --text:        #FFFFFF;
      --text2:       rgba(255, 255, 255, 0.78);
      --muted:       rgba(255, 255, 255, 0.48);
      --sidebar-w:   240px;
      --r:           12px;
      --r-md:        14px;
      --r-lg:        20px;
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
      --glass-inset:  inset 0 1px 1px 0 rgba(255, 255, 255, 0.20);
    }

    /* ── Reset & Base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-system);
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      overflow: hidden;
      min-height: 100vh;
    }
    a { color: var(--secondary); text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }
    input, textarea, select { font-family: inherit; }
    *:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ── Scrollbar ───────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: rgba(14, 18, 30, 0.45);
      backdrop-filter: blur(35px) saturate(200%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.45), inset -1px 0 1px rgba(255, 255, 255, 0.10);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #content {
      flex: 1;
      margin-left: var(--sidebar-w);
      height: 100vh;
      overflow-y: auto;
      background: transparent;
      transition: margin-left 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .page { max-width: 1400px; margin: 0 auto; padding: 40px 48px 64px; }

    /* Landing Mode Layout Override */
    body.is-landing #sidebar {
      transform: translateX(-100%);
      pointer-events: none;
    }
    body.is-landing #hamburger {
      display: none !important;
    }
    body.is-landing #content {
      margin-left: 0;
      width: 100%;
    }

    /* ── Sidebar ──────────────────────────────────────────────────────────── */
    .sidebar-header {
      padding: 24px 20px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      cursor: pointer;
      transition: background 0.15s;
    }
    .sidebar-header:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .sidebar-brand span { color: var(--secondary); }
    .sidebar-tagline { font-size: 11px; color: var(--muted); margin-top: 5px; letter-spacing: 0.02em; }

    .brand-icon-squircle {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.24);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 113, 227, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
      overflow: hidden;
      padding: 4px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .sidebar-header:hover .brand-icon-squircle, .landing-logo:hover .brand-icon-squircle {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.45);
    }
    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.5));
    }

    .sidebar-nav { flex: 1; padding: 18px 14px; overflow-y: auto; }
    .nav-section-label {
      font-size: 10px; font-weight: 700; color: rgba(255, 255, 255, 0.48);
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0 12px; margin: 16px 0 8px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 14px;
      border-radius: 12px;
      color: var(--text2);
      font-size: 13.5px; font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
      background: transparent;
      width: 100%; text-align: left;
      margin-bottom: 4px;
    }
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      transform: translateX(2px);
    }
    .nav-item.active {
      background: linear-gradient(135deg, rgba(0, 113, 227, 0.38) 0%, rgba(138, 43, 226, 0.28) 100%);
      border: 1px solid rgba(255, 255, 255, 0.30);
      box-shadow: 0 4px 18px rgba(0, 113, 227, 0.40), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #ffffff;
      font-weight: 600;
    }
    .nav-item.active .nav-icon {
      color: #00f2fe;
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));
    }
    .nav-icon { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.9; }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.02);
    }
    .engine-status { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .engine-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      flex-shrink: 0;
    }
    .engine-dot.error { background: var(--error); box-shadow: 0 0 8px var(--error); }
    .engine-dot.loading { background: var(--warning); box-shadow: 0 0 8px var(--warning); animation: pulse-dot 1.2s infinite; }
    .engine-label { font-size: 12px; color: var(--text2); font-weight: 500; }
    .version-tag { font-size: 11px; color: var(--muted); }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }

    /* Hamburger */
    #hamburger {
      display: none;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: var(--r); padding: 8px 10px;
      cursor: pointer; color: var(--text2);
      transition: background 0.15s, border-color 0.15s;
    }
    #hamburger:hover {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text);
    }
    #sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 90;
    }

    /* ── Glassmorphism Core Material Classes ───────────────────────────────── */
    .apple-glass {
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--glass-shadow), var(--glass-inset);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.2s ease;
    }

    /* 1. Ultra Thin Material */
    .material-ultra-thin {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* 2. Thin Material */
    .material-thin {
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.20);
    }

    /* 3. Regular System Material */
    .material-regular {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.26);
    }

    /* 4. Thick Material */
    .material-thick {
      background: rgba(255, 255, 255, 0.24);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.32);
    }

    .apple-input {
      width: 100%;
      padding: 12px 16px;
      font-family: var(--font-system);
      font-size: 0.95rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      background: rgba(255, 255, 255, 0.10);
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }
    .apple-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: rgba(255, 255, 255, 0.15);
    }

    .apple-btn {
      font-family: var(--font-system);
      font-size: 0.95rem;
      font-weight: 500;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .icon-container {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .apple-icon-squircle {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      color: #ffffff;
    }
    .apple-icon-squircle:hover {
      transform: translateY(-3px) scale(1.05);
      background: rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 24px var(--primary-glow);
      border-color: rgba(255, 255, 255, 0.35);
    }
    .apple-icon-squircle-sm {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(0, 113, 227, 0.8), rgba(138, 43, 226, 0.8));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      box-shadow: 0 2px 10px rgba(0, 113, 227, 0.4);
    }

    /* ── Page Header ─────────────────────────────────────────────────────── */
    .page-header { margin-bottom: 32px; }
    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.75) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .page-subtitle { font-size: 14px; color: var(--text2); margin-top: 4px; }

    /* ── Section ─────────────────────────────────────────────────────────── */
    .section { margin-bottom: 40px; }
    .section-title {
      font-size: 15px; font-weight: 600; color: var(--text);
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

    /* ── Stats Grid ──────────────────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      margin-bottom: 40px;
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
    }
    .stat-cell {
      background: rgba(255, 255, 255, 0.04);
      padding: 28px 28px 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.15s;
    }
    .stat-cell:hover {
      background: rgba(255, 255, 255, 0.07);
    }
    .stat-value {
      font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.85) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 8px; }

    /* ── Table ───────────────────────────────────────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
      box-shadow: var(--glass-shadow), var(--glass-inset);
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: rgba(255, 255, 255, 0.06); }
    th {
      padding: 13px 18px;
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.07em;
      text-align: left; border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 14px 18px;
      font-size: 13.5px; color: var(--text2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { background: rgba(255, 255, 255, 0.02); cursor: pointer; transition: background 0.15s; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.08); }
    .td-primary { color: var(--text); font-weight: 500; font-size: 13.5px; }
    .td-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; color: var(--muted); }

    /* ── Badge / Status ──────────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px;
      white-space: nowrap;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .badge-success { color: #28C76F; background: rgba(40,199,111,0.12); border: 1px solid rgba(40,199,111,0.3); }
    .badge-success .badge-dot { background: #28C76F; box-shadow: 0 0 6px #28C76F; }
    .badge-running { color: #00f2fe; background: rgba(0, 242, 254, 0.12); border: 1px solid rgba(0, 242, 254, 0.3); }
    .badge-running .badge-dot { background: #00f2fe; box-shadow: 0 0 6px #00f2fe; animation: pulse-dot 1.2s infinite; }
    .badge-failed { color: #EF5B67; background: rgba(239,91,103,0.12); border: 1px solid rgba(239,91,103,0.3); }
    .badge-failed .badge-dot { background: #EF5B67; box-shadow: 0 0 6px #EF5B67; }
    .badge-queued { color: #F5B940; background: rgba(245,185,64,0.12); border: 1px solid rgba(245,185,64,0.3); }
    .badge-queued .badge-dot { background: #F5B940; box-shadow: 0 0 6px #F5B940; }
    .badge-neutral { color: var(--muted); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border); }

    /* ── Buttons ─────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 11px 20px; border-radius: var(--r);
      font-size: 13.5px; font-weight: 600;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: linear-gradient(135deg, #0071e3 0%, #3a88fe 100%);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 16px rgba(0, 113, 227, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #147ce5 0%, #4d94ff 100%);
      box-shadow: 0 6px 22px rgba(0, 113, 227, 0.55);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }
    .btn-ghost {
      background: transparent; color: var(--text2);
      border-color: transparent;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .btn-sm { padding: 7px 14px; font-size: 12.5px; border-radius: 10px; }
    .btn-lg { padding: 14px 28px; font-size: 15px; border-radius: 14px; }

    /* ── Form ────────────────────────────────────────────────────────────── */
    .form-group { margin-bottom: 24px; }
    .form-label { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 7px; display: block; }
    .form-hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      color: var(--text); border-radius: var(--r);
      padding: 11px 16px; font-size: 14px;
      transition: all 0.2s ease;
    }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--muted); }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--primary); outline: none;
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: rgba(255, 255, 255, 0.12);
    }
    .form-textarea { min-height: 90px; resize: vertical; }
    .form-select { appearance: none; cursor: pointer; }
    .form-select option { background: #10151D; color: #fff; }
    .radio-group { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .radio-opt {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: var(--r);
      cursor: pointer; transition: all 0.15s ease;
    }
    .radio-opt:hover {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }
    .radio-opt.selected {
      border-color: var(--primary);
      background: rgba(0, 113, 227, 0.15);
      box-shadow: 0 0 16px rgba(0, 113, 227, 0.25);
    }
    .radio-opt input[type=radio] { margin-top: 3px; accent-color: var(--primary); }
    .radio-opt-label { font-size: 13.5px; font-weight: 500; color: var(--text); }
    .radio-opt-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .form-actions { display: flex; gap: 12px; margin-top: 32px; }

    /* ── Panel ───────────────────────────────────────────────────────────── */
    .panel {
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--border);
      box-shadow: var(--glass-shadow), var(--glass-inset);
      border-radius: var(--r-lg);
      padding: 24px;
    }
    .panel-title {
      font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 16px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    /* ── KV Grid ─────────────────────────────────────────────────────────── */
    .kv-list { display: grid; grid-template-columns: 160px 1fr; row-gap: 0; }
    .kv-key {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.05em;
      padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .kv-val {
      font-size: 13.5px; color: var(--text); font-weight: 500;
      padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .kv-key:last-of-type, .kv-val:last-of-type { border-bottom: none; }

    /* ── Metrics Row ─────────────────────────────────────────────────────── */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      width: 100%;
      margin-bottom: 8px;
    }
    .metric-cell {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: var(--r-md, 14px);
      padding: 16px 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--glass-shadow), inset 0 1px 1px 0 rgba(255, 255, 255, 0.12);
      min-width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .metric-cell:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.30);
      box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.45), inset 0 1px 1px 0 rgba(255, 255, 255, 0.20);
    }
    .metric-value {
      font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.85) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric-label {
      font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Pipeline Stepper ────────────────────────────────────────────────── */
    .pipeline {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 4px; padding: 20px 0 8px;
    }
    .pipe-step {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 12.5px; font-weight: 600; color: var(--muted);
      border: 1px solid transparent;
      white-space: nowrap;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .pipe-step.done { color: #28C76F; border-color: rgba(40,199,111,0.25); background: rgba(40,199,111,0.08); }
    .pipe-step.active { color: #00f2fe; border-color: rgba(0,242,254,0.35); background: rgba(0,242,254,0.10); box-shadow: 0 0 12px rgba(0,242,254,0.2); }
    .pipe-step.failed { color: #EF5B67; border-color: rgba(239,91,103,0.25); background: rgba(239,91,103,0.08); }
    .pipe-arrow { font-size: 11px; color: var(--muted); padding: 0 4px; flex-shrink: 0; }

    /* ── Iterations ──────────────────────────────────────────────────────── */
    .iteration-list { display: flex; flex-direction: column; gap: 12px; }
    .iteration-card {
      border: 1px solid var(--border); border-radius: var(--r-lg);
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
      box-shadow: var(--glass-shadow);
      overflow: hidden;
    }
    .iteration-header {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 20px; cursor: pointer;
      transition: background 0.15s;
    }
    .iteration-header:hover { background: rgba(255, 255, 255, 0.07); }
    .iter-num {
      font-size: 11px; font-weight: 800; color: var(--muted);
      width: 22px; flex-shrink: 0;
    }
    .iter-main { flex: 1; }
    .iter-title { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .iter-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .iter-judge {
      font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 6px;
      flex-shrink: 0;
      backdrop-filter: blur(10px);
    }
    .iter-judge.fix { color: #F5B940; background: rgba(245,185,64,0.12); border: 1px solid rgba(245,185,64,0.25); }
    .iter-judge.finish { color: #28C76F; background: rgba(40,199,111,0.12); border: 1px solid rgba(40,199,111,0.25); }
    .iter-chevron { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
    .iter-chevron.open { transform: rotate(180deg); }
    .iteration-body {
      padding: 0 20px 18px 52px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .iter-section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin: 14px 0 7px; }
    .iter-detail { font-size: 13px; color: var(--text2); }
    .code-block {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--r);
      padding: 12px 14px; margin-top: 6px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px; color: var(--text2);
      white-space: pre-wrap; word-break: break-word;
      max-height: 200px; overflow-y: auto;
    }

    /* ── Accordion / Details ─────────────────────────────────────────────── */
    .accordion {
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      margin-top: 12px;
    }
    .accordion-trigger {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px;
      background: none; border: none; color: var(--text2);
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background 0.15s;
    }
    .accordion-trigger:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
    .accordion-body { padding: 0 18px 14px; display: none; }
    .accordion-body.open { display: block; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 14px; }

    /* ── Search / Toolbar ────────────────────────────────────────────────── */
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .search-input {
      flex: 1; background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      color: var(--text); border-radius: var(--r); padding: 10px 14px;
      font-size: 13.5px;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--primary); outline: none; }
    .filter-select {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      color: var(--text2); border-radius: var(--r);
      padding: 10px 14px; font-size: 13px; cursor: pointer;
    }

    /* ── Empty State ─────────────────────────────────────────────────────── */
    .empty-state { text-align: center; padding: 64px 32px; color: var(--muted); }
    .empty-state-icon { font-size: 32px; margin-bottom: 16px; opacity: 0.6; }
    .empty-state-title { font-size: 16px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
    .empty-state-text { font-size: 13.5px; color: var(--muted); }

    /* ── Loading ─────────────────────────────────────────────────────────── */
    .loading-bar {
      height: 3px; background: rgba(255, 255, 255, 0.12); border-radius: 2px;
      overflow: hidden; margin-bottom: 24px;
    }
    .loading-bar-inner {
      height: 100%; width: 30%; background: linear-gradient(90deg, var(--primary), var(--secondary));
      animation: loading-slide 1.4s ease-in-out infinite;
    }
    @keyframes loading-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(430%); }
    }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--secondary);
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Pipeline Conceptual ─────────────────────────────────────────────── */
    .concept-pipeline {
      display: flex; align-items: center; gap: 8px;
      padding: 24px 0; flex-wrap: wrap;
    }
    .cpipe-step {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      min-width: 88px;
    }
    .cpipe-dot {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--text);
    }
    .cpipe-label { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; }
    .cpipe-arrow { color: var(--muted); font-size: 14px; margin-top: -16px; }

    /* ── Quick Actions ───────────────────────────────────────────────────── */
    .quick-actions { display: flex; gap: 12px; flex-wrap: wrap; }

    /* ── Alert ───────────────────────────────────────────────────────────── */
    .alert {
      padding: 13px 16px; border-radius: var(--r); font-size: 13.5px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
    }
    .alert-success { background: rgba(40,199,111,0.12); color: #28C76F; border: 1px solid rgba(40,199,111,0.25); }
    .alert-error { background: rgba(239,91,103,0.12); color: #EF5B67; border: 1px solid rgba(239,91,103,0.25); }
    .alert-info { background: rgba(0, 113, 227, 0.12); color: #00f2fe; border: 1px solid rgba(0, 113, 227, 0.25); }

    /* ── Progress Steps ──────────────────────────────────────────────────── */
    .progress-steps { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
    .progress-step { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2); }
    .progress-step.done { color: var(--success); }
    .progress-step.active { color: var(--secondary); }
    .step-check { font-size: 14px; width: 18px; text-align: center; }

    /* ── Settings Section ────────────────────────────────────────────────── */
    .settings-section { margin-bottom: 40px; }
    .settings-section-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .settings-section-desc { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .settings-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row-label { font-size: 13.5px; font-weight: 500; color: var(--text); }
    .settings-row-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .settings-row-value { font-size: 13px; color: var(--text2); font-weight: 500; font-family: monospace; }
    .config-pill {
      display: inline-block; padding: 4px 11px;
      border-radius: 6px; font-size: 11.5px; font-weight: 600;
      font-family: monospace;
    }
    .config-ok { background: rgba(40,199,111,0.15); color: #28C76F; border: 1px solid rgba(40,199,111,0.3); }
    .config-no { background: rgba(255, 255, 255, 0.08); color: var(--muted); border: 1px solid var(--border); }

    /* ── Landing Page Specific Styles ────────────────────────────────────── */
    .landing-page-wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 32px 80px;
    }

      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-radius: 20px;
      margin-bottom: 32px;
      position: sticky;
      top: 16px;
      z-index: 50;
    }
    .landing-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .landing-logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .brand-ml { font-size: 19px; font-weight: 800; color: #00f2fe; }
    .brand-zero { font-size: 19px; font-weight: 800; color: #ffffff; }
    .brand-tag { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .landing-topbar-links {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .topbar-nav-link {
      background: transparent;
      border: none;
      color: var(--text2);
      font-size: 13.5px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .topbar-nav-link:hover {
      background: rgba(255, 255, 255, 0.12);

    }

      position: absolute;

      filter: saturate(1.15) brightness(0.92);

    .landing-hero-overlay {
      position: absolute;

                  linear-gradient(180deg, rgba(7, 9, 14, 0.35) 0%, rgba(7, 9, 14, 0.90) 100%);

    .landing-hero-content {

      gap: 10px;
      margin-bottom: 24px;

      max-width: max-content;

    .hero-chip-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #00f2fe;

    .hero-chip-text {

    }
    .landing-hero-title {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -0.04em;

      margin-bottom: 14px;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.75) 60%, rgba(180, 215, 255, 0.95) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 45px rgba(0, 113, 227, 0.35);
    }
    .landing-hero-tagline {

      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: -0.02em;

    }
    .landing-hero-desc {
      font-size: 1.1rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.72);

      margin-bottom: 38px;
    }
    .landing-cta-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 48px;

      justify-content: center;
    }
    .apple-btn-start {

      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 36px rgba(0, 113, 227, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #ffffff;
      padding: 16px 36px;
      border-radius: 18px;
      font-size: 1.1rem;
      font-weight: 600;

      display: inline-flex;

      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .apple-btn-start:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 44px rgba(138, 43, 226, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }
    .start-symbol-wrap {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.6);

    .start-arrow-icon {
      font-size: 14px;

    }
    .apple-btn-start:hover .start-arrow-icon {

    }
    .apple-btn-secondary-hero {
      background: rgba(255, 255, 255, 0.12);

      border-radius: 18px;
      font-size: 1.05rem;

      transition: all 0.2s ease;
    }

      background: rgba(255, 255, 255, 0.20);

    }
    .hero-pill-stats {
      display: flex;

      gap: 24px;

      border-radius: 30px;

      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .h-stat-num {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(180deg, #fff, #a2d2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .h-stat-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .h-stat-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.15);
    }
    .landing-showcase-section {
      margin-bottom: 64px;
    }
    .landing-section-head {
      text-align: center;
      margin-bottom: 40px;
    }
    .dashboard-title {
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: -0.04rem;
      margin-bottom: 12px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .landing-section-sub {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.7);
      max-width: 640px;
      margin: 0 auto;
    }
    .grid-container {
      max-width: 1400px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 24px;
    }
    .card-badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .material-pill {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: rgba(255, 255, 255, 0.85);
    }
    .tech-tag {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #00f2fe;
      font-weight: 600;
    }
    .landing-pipeline-section {
      margin-bottom: 64px;
      padding: 40px;
    }
    .pipeline-section-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .landing-stepper-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .l-step-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .l-step-num {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff !important;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.5);
      letter-spacing: -0.02em;
    }
    .l-step-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
    }
    .l-step-desc {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.4;
    }

    /* ── Responsive Layout & Spacing ─────────────────────────────────────── */
    .new-run-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 36px;
      align-items: start;
    }
    .run-details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 36px;
    }

    /* Preset pills */
    .preset-pill-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;

      .mobile-topbar {

      #hamburger {

        width: 38px;

        color: var(--text);
        flex-shrink: 0;

      .mobile-brand {

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; gap: 10px; }
      .metrics-row { grid-template-columns: 1fr 1fr; }

    }
  </style>
</head>

<script>
'use strict';

/* ── Constants ────────────────────────────────────────────────────────────── */
const POLL_MS = 2000;
const ACTIVE = ['QUEUED', 'RUNNING'];

/* ── Utils ────────────────────────────────────────────────────────────────── */
const Utils = {
  esc(s) {
    if (s == null) return '—';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  },
  formatDur(sec) {
    if (sec == null) return '—';
    if (sec < 1) return `${Math.round(sec * 1000)}ms`;
    return `${sec.toFixed(2)}s`;
  },
  formatDate(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleString(undefined, {
        month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    } catch(e) { return iso; }
  },
  shortId(id) {
    if (!id) return '—';
    return id.slice(0, 8) + '…';
  },
  taskType(ts) {
    if (!ts) return '—';
    if (ts.task_type) return ts.task_type;
    const t = ts.task;
    return (t && t.task_type) ? t.task_type : '—';
  },
  targetCol(ts) {
    if (!ts) return '—';
    if (ts.target_column) return ts.target_column;
    const t = ts.task;
    return (t && t.target_column) ? t.target_column : '—';
  },
  datasetName(r) {
    if (!r) return '—';
    if (r.dataset_name) return r.dataset_name;
    const ts = r.task_summary;
    if (ts) {
      if (ts.dataset_name) return ts.dataset_name;
      if (ts.input_data_files && ts.input_data_files.length) {
        const clean = ts.input_data_files[0].replace(/\\/g, '/');
        const parts = clean.split('/').filter(Boolean);
        if (parts.length >= 2) {
          const folder = parts[parts.length - 2];
          return folder.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }
      }
      if (ts.dataset_path) {
        const clean = ts.dataset_path.replace(/\\/g, '/');
        const parts = clean.split('/').filter(Boolean);
        const folder = parts[parts.length - 1] || ts.dataset_path;
        return folder.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      }
      if (ts.objective) {
        return ts.objective.length > 25 ? ts.objective.slice(0, 25) + '…' : ts.objective;
      }
    }
    return Utils.shortId(r.run_id);
  },
  statusBadge(status) {
    const map = {
      'SUCCESS': 'badge-success',
      'RUNNING': 'badge-running',
      'QUEUED':  'badge-queued',
      'FAIL':    'badge-failed',
      'FAILED':  'badge-failed',
      'TIMEOUT': 'badge-queued',
    };
    const cls = map[status] || 'badge-neutral';
    return `<span class="badge ${cls}"><span class="badge-dot"></span>${Utils.esc(status)}</span>`;
  },
  canBeNegativeMetric(name) {
    const n = (name || '').toLowerCase().trim().replace(/[\s-]+/g, '_');
    const known = ['r2', 'r_squared', 'r2_score', 'pearson', 'pearson_correlation', 'pearsonr', 'spearman', 'spearman_correlation', 'spearmanr', 'mcc', 'matthews_corrcoef', 'matthews_correlation'];
    return known.includes(n) || (n.startsWith('neg_') && known.includes(n.slice(4)));
  },
  isLowerIsBetterMetric(name) {
    const n = (name || '').toLowerCase().trim().replace(/[\s-]+/g, '_');
    if (this.canBeNegativeMetric(n)) return false;
    if (n.startsWith('neg_')) return true;
    const known = [
      'rmse', 'root_mean_squared_error',
      'mse', 'mean_squared_error',
      'mae', 'mean_absolute_error',
      'median_absolute_error', 'medae',
      'msle', 'rmsle', 'mape', 'smape',
      'log_loss', 'cross_entropy', 'nll',
      'brier_score_loss', 'hinge_loss', 'pinball_loss', 'quantile_loss'
    ];
    if (known.includes(n)) return true;
    if (n.endsWith('_error') || n.endsWith('_loss')) return true;
    const tokens = n.split('_');
    return tokens.some(t => ['rmse', 'mse', 'mae', 'medae', 'msle', 'rmsle', 'mape', 'smape'].includes(t));
  },
  canonicalizeMetric(name, val) {
    if (typeof val !== 'number' || isNaN(val)) return [name, val];
    let n = name;
    let v = val;
    if (n.toLowerCase().startsWith('neg_')) {
      const stem = n.slice(4);
      if (!this.canBeNegativeMetric(stem)) {
        n = stem;
        v = Math.abs(v);
        return [n, v];
      }
    }
    if (this.canBeNegativeMetric(n)) {
      return [n, v];
    }
    if (this.isLowerIsBetterMetric(n) && v < 0) {
      return [n, Math.abs(v)];
    }
    return [n, v];
  },
  canonicalizeMetrics(metrics) {
    if (!metrics || typeof metrics !== 'object') return {};
    const res = {};
    for (const [k, v] of Object.entries(metrics)) {
      const [ck, cv] = this.canonicalizeMetric(k, v);
      res[ck] = cv;
    }
    return res;
  },
  bestMetric(metrics) {
    if (!metrics) return '—';
    const can = this.canonicalizeMetrics(metrics);
    const keys = ['accuracy','roc_auc','f1','f1_score','rmse','mae','r2'];
    for (const k of keys) {
      if (can[k] != null) return `${Number(can[k]).toFixed(4)}`;
    }
    const vals = Object.values(can).filter(v => typeof v === 'number' && !isNaN(v));
    return vals.length ? Number(vals[0]).toFixed(4) : '—';
  },
  llmBadge(backend) {
    const isReal = (backend || '').toLowerCase() === 'real';
    if (isReal) {
      return `<span class="badge" style="background:rgba(0,242,254,0.12);color:#00f2fe;border:1px solid rgba(0,242,254,0.3);font-size:11px;font-weight:600;"><span class="badge-dot" style="background:#00f2fe;box-shadow:0 0 6px #00f2fe;"></span>Real LLM</span>`;
    }
    return `<span class="badge badge-neutral" style="font-size:11px;font-weight:600;"><span class="badge-dot" style="background:var(--muted)"></span>Mock LLM</span>`;
  }
};

/* ── API Client ───────────────────────────────────────────────────────────── */
const API = {
  async get(path) {
    const r = await fetch(path);
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      throw new Error(body.detail || `${r.status} ${r.statusText}`);
    }
    return r.json();
  },
  async post(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      const body2 = await r.json().catch(() => ({}));
      throw new Error(body2.detail || `${r.status} ${r.statusText}`);
    }
    return r.json();
  },
  async upload(file) {
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch('/datasets/upload', {
      method: 'POST',
      body: fd
    });
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      throw new Error(body.detail || `${r.status} ${r.statusText}`);
    }
    return r.json();
  }
};

/* ── State ────────────────────────────────────────────────────────────────── */
const State = {
  pollTimer: null,
  pollSessionId: 0,
  startPolling(runId, cb) {
    this.stopPolling();
    const sessionId = ++this.pollSessionId;
    const tick = async () => {
      if (this.pollSessionId !== sessionId) return;
      try {
        const s = await API.get(`/runs/${runId}`);
        if (this.pollSessionId !== sessionId) return;
        cb(s);
        if (ACTIVE.includes(s.status)) {
          this.pollTimer = setTimeout(tick, POLL_MS);
        } else {
          this.pollTimer = null;
        }
      } catch(e) {
        if (this.pollSessionId !== sessionId) return;
        this.pollTimer = null;
        if (e.message.includes('404') || e.message.includes('Not Found') || e.message.includes('Run not found')) {
            try {
                localStorage.removeItem('currentRunId');
                sessionStorage.removeItem('currentRunId');
                localStorage.removeItem('runId');
                sessionStorage.removeItem('runId');
            } catch (err) {}
            
            // Use location.hash to trigger hashchange → Router._dispatch()
            location.hash = '#/runs';
            return; // Don't call cb — page is being navigated away
        } else {
            cb({ _error: e.message });
        }
      }
    };
    tick();
  },
  stopPolling() {
    this.pollSessionId++;
    if (this.pollTimer) { clearTimeout(this.pollTimer); this.pollTimer = null; }
  }
};

/* ── Router ───────────────────────────────────────────────────────────────── */
const Router = {
  init() {
    window.addEventListener('hashchange', () => this._dispatch());
    this._dispatch();
    // Nav clicks
    document.querySelectorAll('.nav-item[data-page]').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = btn.dataset.page;
        location.hash = '#/' + p;
      });
    });
  },
  navigate(page, params='') {
    location.hash = '#/' + page + (params ? '/' + params : '');
  },
  _dispatch() {
    State.stopPolling();
    // Auto-close mobile sidebar on navigation
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('sidebar-overlay')?.classList.remove('open');

    const hash = location.hash || '#/landing';
    const parts = hash.replace('#/', '').split('/');
    const page = parts[0] || 'landing';
    const param = parts[1] || null;

    if (page === 'landing') {
      document.body.classList.add('is-landing');
    } else {
      document.body.classList.remove('is-landing');
    }

    // Update active nav item
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    const active = document.querySelector(`.nav-item[data-page="${page}"]`);
    if (active) active.classList.add('active');

    // Render page
    const outlet = document.getElementById('page-outlet');
    outlet.innerHTML = '<div class="page"><div class="loading-bar"><div class="loading-bar-inner"></div></div></div>';

    const renderer = Pages[page];
    if (renderer) renderer(param);
    else Pages.landing(null);
  }
};

/* ── Components ───────────────────────────────────────────────────────────── */
const C = {
  pipeline(status, runStatus) {
    const steps = ['Perception','Retrieval','Code Gen','Execution','Judge','Complete'];
    let states;
    const s = typeof status === 'string' ? status : (status && status.status);
    const r = (typeof status === 'object' && status !== null) ? status : (runStatus || {});
    const pTrace = r.pipeline_trace || {};
    const iters = r.iterations;

    if (s === 'SUCCESS') {
      states = steps.map(() => 'done');
    } else if (ACTIVE.includes(s)) {
      states = ['done','done','done','active','pending','pending'];
    } else if (['FAIL','FAILED'].includes(s)) {
      if (iters != null && iters > 0) {
        states = ['done','done','done','failed','done','failed'];
      } else if (pTrace.perception_completed === false || (!r.task_summary && !r.dataset_name && iters == null)) {
        states = ['failed','pending','pending','pending','pending','failed'];
      } else {
        states = ['done','pending','pending','pending','pending','failed'];
      }
    } else {
      states = steps.map(() => 'pending');
    }
    const icons = {done:'✓', active:'●', pending:'○', failed:'✕'};
    let html = '<div class="pipeline">';
    steps.forEach((s, i) => {
      const st = states[i];
      html += `<span class="pipe-step ${st}">${icons[st]} ${s}</span>`;
      if (i < steps.length - 1) html += '<span class="pipe-arrow">→</span>';
    });
    html += '</div>';
    return html;
  },

  iterationCard(ep, idx) {
    const isSuccess = ep.status === 'SUCCESS';
    const judgeDecision = ep.judge_decision || (isSuccess ? 'FINISH' : 'FIX');
    const judgeCls = judgeDecision === 'FINISH' ? 'finish' : 'fix';

    const title = isSuccess
      ? 'Execution succeeded'
      : (ep.error_summary || ep.error_category || 'Execution failed');

    const sub = isSuccess
      ? (ep.summary || 'Code ran successfully; judge decision: FINISH')
      : (ep.judge_reason || ep.suggested_fix || 'Judge decision: FIX — preparing correction');

    const id = `iter-${idx}`;
    return `
      <div class="iteration-card">
        <div class="iteration-header" onclick="toggleIter('${id}')">
          <div class="iter-num">${String(ep.iteration || idx + 1).padStart(2,'0')}</div>
          ${Utils.statusBadge(ep.status)}
          <div class="iter-main">
            <div class="iter-title">${Utils.esc(title)}</div>
            <div class="iter-sub">${Utils.esc(sub)}</div>
          </div>
          <span class="iter-judge ${judgeCls}">${Utils.esc(judgeDecision)}</span>
          <span class="iter-chevron" id="${id}-chev">▼</span>
        </div>
        <div class="iteration-body" id="${id}" style="display:none">
          ${ep.error_category ? `
            <div class="iter-section-title">Error Category</div>
            <div class="iter-detail">${Utils.esc(ep.error_category)}</div>
          ` : ''}
          ${ep.suggested_fix && !isSuccess ? `
            <div class="iter-section-title">Suggested Fix</div>
            <div class="iter-detail">${Utils.esc(ep.suggested_fix)}</div>
          ` : ''}
          ${ep.judge_reason ? `
            <div class="iter-section-title">Judge Reasoning</div>
            <div class="iter-detail">${Utils.esc(ep.judge_reason)}</div>
          ` : ''}
          ${ep.generated_code || ep.code_content ? `
            <div class="iter-section-title">Generated Code (Python)</div>
            <div class="code-block" style="max-height:350px;overflow-y:auto">${Utils.esc((ep.generated_code || ep.code_content).trim())}</div>
          ` : ''}
          ${ep.stdout ? `
            <div class="iter-section-title">Execution Output</div>
            <div class="code-block">${Utils.esc(ep.stdout.slice(0, 1000))}${ep.stdout.length > 1000 ? '\n…(truncated)' : ''}</div>

          ${ep.stderr && !isSuccess ? `
            <div class="iter-section-title">Error Output</div>
            <div class="code-block" style="color:var(--error)">${Utils.esc(ep.stderr.slice(0, 800))}${ep.stderr.length > 800 ? '\n…' : ''}</div>
          ` : ''}
        </div>
      </div>`;
  }
};

function toggleIter(id) {
  const body = document.getElementById(id);
  const chev = document.getElementById(id + '-chev');
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? '' : 'rotate(180deg)';
}

  if (!files || !files.length) return;
  const file = files[0];
  const statusEl = document.getElementById('upload-status');
  const btn = document.getElementById('upload-btn');
  try {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Uploading…';
    statusEl.textContent = `Uploading ${file.name}…`;
    statusEl.style.color = 'var(--text2)';
    const res = await API.upload(file);
    document.getElementById('ds-path').value = res.dataset_path;
    updateSummary();
    statusEl.innerHTML = `<span style="color:var(--success)"><i class="fa-solid fa-circle-check"></i> Uploaded: ${Utils.esc(res.dataset_path)}</span>`;
  } catch(e) {
    statusEl.innerHTML = `<span style="color:var(--error)"><i class="fa-solid fa-triangle-exclamation"></i> Upload failed: ${Utils.esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-folder-open" style="margin-right:5px"></i>Browse File';
  }
}

function selectLLM(radio) {
  document.querySelectorAll('.radio-opt').forEach(el => el.classList.remove('selected'));
  radio.closest('.radio-opt').classList.add('selected');
  updateSummary();
}

function updateSummary() {
  const ds = document.getElementById('ds-path')?.value || '';
  const inst = document.getElementById('task-inst')?.value?.trim() || '';
  const llm = document.querySelector('input[name=llm]:checked')?.value || 'mock';
  const el = id => document.getElementById(id);
  if (el('sum-dataset')) el('sum-dataset').textContent = ds || '—';
  if (el('sum-inst')) {
    el('sum-inst').textContent = inst || 'Auto-detect';
    el('sum-inst').style.fontStyle = inst ? 'normal' : 'italic';
    el('sum-inst').style.color = inst ? '' : 'var(--muted)';
  }
  if (el('sum-llm')) el('sum-llm').textContent = llm === 'mock' ? 'Mock (Offline)' : 'Real (Gemini)';
  if (el('sum-prov')) el('sum-prov').textContent = llm === 'mock' ? 'Offline' : 'Gemini + OpenRouter';
}

async function submitRun() {
  const ds = document.getElementById('ds-path').value.trim();
  const inst = document.getElementById('task-inst').value.trim();
  const llm = document.querySelector('input[name=llm]:checked')?.value || 'mock';
  const alertEl = document.getElementById('run-alert');
  const btn = document.getElementById('run-btn');

  if (!ds) {
    alertEl.innerHTML = '<div class="alert alert-error">Dataset path is required.</div>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Starting…';
  alertEl.innerHTML = '';

  try {
    const resp = await API.post('/runs', {
      dataset_path: ds,
      user_instruction: inst || null,
      options: { mock_llm: llm === 'mock', llm_mode: llm }
    });
    // Navigate to run details
    Router.navigate('runs', resp.run_id);
  } catch(e) {
    alertEl.innerHTML = `<div class="alert alert-error">${Utils.esc(e.message)}</div>`;
    btn.disabled = false;
    btn.innerHTML = 'Start Agentic Run';
  }
}

function clearRunForm() {
  const f = id => document.getElementById(id);
  if (f('ds-path')) f('ds-path').value = '';
  if (f('task-inst')) f('task-inst').value = '';
  const mock = document.querySelector('input[name=llm][value=mock]');
  if (mock) { mock.checked = true; selectLLM(mock); }
  if (f('run-alert')) f('run-alert').innerHTML = '';
  updateSummary();
}

Pages.runs = async function(runIdParam) {
  // If there's a run ID param, show run details
  if (runIdParam) {
    return Pages._runDetails(runIdParam);
  }

  const outlet = document.getElementById('page-outlet');
  outlet.innerHTML = `

      <div class="page-header">
        <div class="page-title">Runs</div>
        <div class="page-subtitle">Browse and inspect agentic run history</div>
      </div>
      <div class="toolbar">
        <input type="text" class="search-input" id="run-search" placeholder="Search by run ID, library, task, client…" oninput="filterRuns()">
        <select class="filter-select" id="run-status-filter" onchange="filterRuns()">
          <option value="">All Status</option>
          <option value="SUCCESS">Success</option>
          <option value="RUNNING">Running</option>
          <option value="QUEUED">Queued</option>
          <option value="FAIL">Failed</option>
        </select>
        <select class="filter-select" id="run-backend-filter" onchange="filterRuns()">

    const missing = runs.filter(r => !r.execution_backend);
    if (missing.length > 0) {
      await Promise.all(missing.map(async r => {
        try {
          const detail = await API.get(`/runs/${r.run_id}`);

function renderRunsTable(runs) {
  const el = document.getElementById('runs-table-area');
  if (!el) return;
  if (!runs.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">○</div>
        <div class="empty-state-title">No runs found</div>
        <div class="empty-state-text">Start a new agentic run to see results here.</div>
      </div>`;
    return;
  }
  const rows = runs.map(r => `
    <tr onclick="Router.navigate('runs', '${r.run_id}')">
      <td class="td-mono" title="${r.run_id}">${Utils.shortId(r.run_id)}</td>
      <td class="td-primary" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${Utils.esc(Utils.datasetName(r))}">
        ${Utils.esc(Utils.datasetName(r))}
      </td>
      <td>${Utils.taskType(r.task_summary)}</td>
      <td>${Utils.llmBadge(r.execution_backend)}</td>
      <td>${Utils.esc(r.selected_library || '—')}</td>
      <td>${Utils.statusBadge(r.status)}</td>
      <td>${r.iterations != null ? r.iterations : '—'}</td>
      <td>${Utils.formatDur(r.execution_duration)}</td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Run ID</th><th>Dataset</th><th>Task</th><th>LLM Client</th><th>Library</th>
          <th>Status</th><th>Iterations</th><th>Duration</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function filterRuns() {
  const q = (document.getElementById('run-search')?.value || '').toLowerCase();
  const st = document.getElementById('run-status-filter')?.value || '';
  const be = document.getElementById('run-backend-filter')?.value || '';
  const runs = (window._allRuns || []).filter(r => {
    const text = [r.run_id, Utils.datasetName(r), r.selected_library, Utils.taskType(r.task_summary), r.execution_backend, (r.execution_backend === 'real' ? 'real llm' : 'mock llm')].join(' ').toLowerCase();
    const matchQ = !q || text.includes(q);
    const matchS = !st || r.status === st;
    const matchB = !be || (r.execution_backend || 'mock') === be;
    return matchQ && matchS && matchB;
  });
  renderRunsTable(runs);
}

/* ── Run Details ───────────────────────────────────────────────────────────── */
Pages._runDetails = async function(runId) {
  const outlet = document.getElementById('page-outlet');
  outlet.innerHTML = `
    <div class="page">
      <div style="margin-bottom:24px">
        <button class="btn btn-ghost btn-sm" onclick="Router.navigate('runs')" style="margin-bottom:16px">
          ← Back to Runs
        </button>
        <div class="page-header" style="margin-bottom:16px">
          <div class="page-title">Run Details</div>
          <div class="page-subtitle td-mono" style="font-size:12px">${Utils.esc(runId)}</div>
        </div>
      </div>
      <div id="run-detail-body"><div class="loading-bar"><div class="loading-bar-inner"></div></div></div>
    </div>`;

  const render = (status) => {
    const el = document.getElementById('run-detail-body');
    if (!el) return;

    if (status._error) {
       el.innerHTML = `
         <div class="panel" style="border-color:var(--error);background:#fff1f0;padding:16px;">
           <div class="panel-title" style="color:var(--error);margin-bottom:8px">Run no longer exists.</div>
           <div style="font-size:13px;color:var(--text2)">${Utils.esc(status._error)}</div>
         </div>
       `;
       return;
    }

    const isActive = ACTIVE.includes(status.status);
    const dur = Utils.formatDur(status.execution_duration);
    
    // Check if anything actually changed besides the clock
    const sClone = { ...status, execution_duration: 0 };
    const stateStr = JSON.stringify(sClone);
    if (el._lastState === stateStr) {
      const durEl = document.getElementById('run-duration-text');
      if (durEl && dur !== '—') durEl.textContent = `· ${dur}`;
      loadIterations(runId);
      return;
    }
    el._lastState = stateStr;

    const ts = status.task_summary;
    const lib = status.selected_library || '—';

    // Task context KV
    let kvRows = '';
    if (ts && ts.task) {
      const t = ts.task;
      const isRealLLM = (status.execution_backend || '').toLowerCase() === 'real';
      const fields = [
        ['Task Type', t.task_type],
        ['LLM Client', isRealLLM ? 'Real LLM (External API)' : 'Mock LLM (Local Simulation)'],
        ['Target Column', t.target_column],
        ['Modality', t.modality],
        ['Timestamp Column', t.timestamp_column],
        ['ID Column', t.id_column],
        ['Objective', t.objective],
      ];
      fields.forEach(([k,v]) => {
        if (v) kvRows += `<div class="kv-key">${k}</div><div class="kv-val">${Utils.esc(v)}</div>`;
      });
    }
    if (!kvRows) kvRows = `<div class="kv-key">Library</div><div class="kv-val">${Utils.esc(lib)}</div>`;

    // Metrics
    let metricsHtml = '';
    const canMetrics = Utils.canonicalizeMetrics(status.final_metrics);
    if (canMetrics && Object.keys(canMetrics).length) {
      const metricCells = Object.entries(canMetrics)
        .filter(([,v]) => typeof v === 'number' && !isNaN(v))
        .map(([k,v]) => {
          const formatted = Number(v).toFixed(4);
          const rawName = k.replace(/_/g,' ');
          return `
          <div class="metric-cell" title="${Utils.esc(rawName)}: ${formatted}">
            <div class="metric-value">${formatted}</div>
            <div class="metric-label" title="${Utils.esc(rawName)}">${Utils.esc(rawName)}</div>
          </div>`;
        }).join('');
      metricsHtml = metricCells
        ? `<div class="metrics-row">${metricCells}</div>`
        : '<div style="color:var(--muted);font-size:13px">No numeric metrics available.</div>';
    } else {
      metricsHtml = '<div style="color:var(--muted);font-size:13px">No metrics available yet.</div>';
    }

    // Diagnostics
    let diagHtml;
    if (status.final_error && status.final_error.trim()) {
      diagHtml = `
        <div style="color:var(--error);font-size:13.5px;font-weight:600;margin-bottom:10px">
          Execution encountered an error
        </div>
        <div class="accordion">
          <button class="accordion-trigger" onclick="toggleAccordion(this)">
            View technical details <span>▼</span>
          </button>
          <div class="accordion-body">
            <div class="code-block" style="color:var(--error)">${Utils.esc(status.final_error)}</div>
          </div>
        </div>`;
    } else if (!isActive) {
      diagHtml = '<div style="color:var(--success);font-size:13.5px;font-weight:600">✓ No errors reported</div>';
    } else {
      diagHtml = '<div style="color:var(--muted);font-size:13px">Run in progress…</div>';
    }

    // Artifacts
    const predRef = status.prediction_artifact_reference;
    const modelRef = status.model_artifact_reference;
    const artHtml = (predRef || modelRef)
      ? `
          ${predRef ? `
            <div>
              <span style="font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700">Predictions</span>
              <div style="font-size:13px;color:var(--text2);margin-top:4px;font-family:monospace">${Utils.esc(predRef)}</div>
              <a href="/runs/${status.run_id}/predictions/download" download class="btn btn-secondary btn-sm" style="display:inline-flex;align-items:center;gap:6px;margin-top:8px;text-decoration:none">
                <i class="fa-solid fa-download"></i> Download predictions.csv
              </a>
            </div>` : ''}
          ${modelRef ? `<div><span style="font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700">Model</span><div style="font-size:13px;color:var(--text2);margin-top:4px;font-family:monospace">${Utils.esc(modelRef)}</div></div>` : ''}
        </div>`
      : '<div style="color:var(--muted);font-size:13px">No artifacts yet.</div>';

    // Raw JSON accordion
    const rawJson = JSON.stringify(status, null, 2);

    el.innerHTML = `
      <!-- Header strip -->
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:32px">
        ${Utils.statusBadge(status.status)}
        ${Utils.llmBadge(status.execution_backend)}
        <span style="font-size:13px;color:var(--muted)">
          ${status.iterations != null ? `${status.iterations} iteration${status.iterations !== 1 ? 's' : ''}` : ''} 
          <span id="run-duration-text">${dur !== '—' ? `· ${dur}` : ''}</span> 
          · ${Utils.esc(lib)}
        </span>
        ${isActive ? '<span class="spinner"></span>' : ''}
      </div>

      <!-- Pipeline -->
      <div class="section">
        <div class="section-title">Agent Execution</div>
        ${C.pipeline(status.status, status)}
      </div>

      <!-- Task Context -->
      ${ts ? `
      <div class="section">
        <div class="section-title">Task Context</div>
        <div class="panel" style="padding:0 24px">
          <div class="kv-list">${kvRows}</div>
        </div>
        <div class="accordion">
          <button class="accordion-trigger" onclick="toggleAccordion(this)">
            View raw perception JSON <span>▼</span>
          </button>
          <div class="accordion-body">
            <div class="code-block">${Utils.esc(JSON.stringify(ts, null, 2))}</div>
          </div>
        </div>
      </div>` : ''}

      <!-- Metrics -->
      <div class="section">
        <div class="section-title">Metrics</div>
        ${metricsHtml}
      </div>

      <!-- Iterations -->
      <div class="section">
        <div class="section-title">Iteration History</div>
        <div id="iterations-area">
          <div class="empty-state" style="padding:32px">
            <div class="empty-state-text">Loading iteration history…</div>
          </div>
        </div>
      </div>

      <!-- Diagnostics + Artifacts -->
      <div class="run-details-grid">
        <div class="panel">
          <div class="panel-title">Diagnostics</div>
          ${diagHtml}
        </div>
        <div class="panel">
          <div class="panel-title">Artifacts</div>
          ${artHtml}
        </div>
      </div>

      <!-- Raw JSON -->
      <div class="accordion">
        <button class="accordion-trigger" onclick="toggleAccordion(this)">
          View full run JSON <span>▼</span>
        </button>
        <div class="accordion-body">
          <div class="code-block" style="max-height:400px">${Utils.esc(rawJson)}</div>
        </div>
      </div>
    `;

    // Load episodes separately
    loadIterations(runId);
  };

  State.startPolling(runId, render);
};

async function loadIterations(runId) {
  const el = document.getElementById('iterations-area');
  if (!el) return;
  try {
    const data = await API.get(`/runs/${runId}/episodes`);
    const episodes = data.episodes || [];
    const episodesStr = JSON.stringify(episodes);
    if (el._lastEpisodes === episodesStr) return;
    el._lastEpisodes = episodesStr;
    
    if (!episodes.length) {
      el.innerHTML = `<div class="empty-state" style="padding:32px"><div class="empty-state-text">No iterations recorded yet.</div></div>`;
      return;
    }
    el.innerHTML = `<div class="iteration-list">${episodes.map((ep, i) => C.iterationCard(ep, i)).join('')}</div>`;
  } catch(e) {
    if (e.message.includes('Run not found') || e.message.includes('404')) {
      el.innerHTML = `<div class="empty-state" style="padding:32px"><div class="empty-state-text">Run not found.</div></div>`;
    } else {
      el.innerHTML = `<div style="color:var(--muted);font-size:13px">Could not load iterations: ${Utils.esc(e.message)}</div>`;
    }
  }
}

function toggleAccordion(btn) {
  const body = btn.nextElementSibling;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  const arrow = btn.querySelector('span');
  if (arrow) arrow.style.transform = isOpen ? '' : 'rotate(180deg)';
}

async function searchMemory() {

    el.innerHTML = '<div style="color:var(--muted);font-size:13px">Enter a query to search.</div>';

  el.innerHTML = '<div class="loading-bar"><div class="loading-bar-inner"></div></div>';
  try {
    const data = await API.get(`/memory/search?q=${encodeURIComponent(q)}&top_k=8`);
    if (data.error) {
      el.innerHTML = `<div class="alert alert-info">${Utils.esc(data.error)}</div>`;
      return;

    const results = data.results || [];
    if (!results.length) {

        </table>
      </div>`;
  } catch(e) {
    el.innerHTML = `<div class="alert alert-error">${Utils.esc(e.message)}</div>`;
  }
}

async function loadRecentEpisodes() {
  const el = document.getElementById('epi-area');
  if (!el) return;
  try {
    const runs = await API.get('/runs');
    const recentRuns = runs.slice(0, 5);
    if (!recentRuns.length) {
      el.innerHTML = `<div class="empty-state" style="padding:32px"><div class="empty-state-text">No episodic memory yet. Start a run to populate.</div></div>`;
      return;
    }
    // Load episodes for recent runs
    const epPromises = recentRuns.map(r => API.get(`/runs/${r.run_id}/episodes`).catch(() => null));
    const epResults = await Promise.all(epPromises);
    const allEps = [];
    epResults.forEach((data, i) => {
      if (data && data.episodes) {
        data.episodes.forEach(ep => allEps.push({...ep, _run_id: recentRuns[i].run_id}));
      }
    });
    if (!allEps.length) {
      el.innerHTML = `<div class="empty-state" style="padding:32px"><div class="empty-state-text">No episodes recorded yet.</div></div>`;
      return;
    }
    const rows = allEps.slice(0, 20).map(ep => `
      <tr onclick="Router.navigate('runs', '${ep.run_id}')">
        <td class="td-mono">${Utils.shortId(ep.run_id)}</td>
        <td>${ep.iteration || '—'}</td>
        <td>${Utils.statusBadge(ep.status)}</td>
        <td>${Utils.esc(ep.error_category || ep.error_summary || '—')}</td>
        <td>${Utils.esc(ep.suggested_fix ? ep.suggested_fix.slice(0,60) + '…' : '—')}</td>
        <td>${Utils.formatDate(ep.timestamp)}</td>
      </tr>`).join('');
    el.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Run</th><th>Iteration</th><th>Status</th><th>Error</th><th>Resolution</th><th>Time</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } catch(e) {
    el.innerHTML = `<div class="alert alert-error">${Utils.esc(e.message)}</div>`;
  }
}

Pages.loadEvaluationSummary = async function() {
  const el = document.getElementById('eval-area');
  if (!el) return;
  try {
    const data = await API.get('/evaluation/summary');
    if (!data || data.error || !data.suite) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">○</div>
          <div class="empty-state-title">No evaluation data</div>
          <div class="empty-state-text">
            Run an evaluation to populate this page.<br>
            Use the command below to generate benchmark data.
          </div>
        </div>`;
      return;
    }

    const suite = data.suite;
    const cases = suite.cases || [];
    const avgSuccess = cases.length
      ? ((cases.reduce((acc, c) => acc + (c.success_rate || 0), 0) / cases.length) * 100).toFixed(0) + '%'
      : '—';
    const avgRecovery = cases.length
      ? ((cases.reduce((acc, c) => acc + (c.recovery_rate || 0), 0) / cases.length) * 100).toFixed(0) + '%'
      : '—';

    const caseRows = cases.map(c => `
      <tr>
        <td class="td-primary">${Utils.esc(c.name || c.case_id)}</td>
        <td><span class="badge badge-neutral">${Utils.esc(c.task_type || '—')}</span></td>
        <td>${Utils.esc(c.expected_library || '—')}</td>
        <td style="font-weight:700;color:${(c.success_rate || 0) >= 0.8 ? 'var(--success)' : 'var(--error)'}">
          ${((c.success_rate || 0) * 100).toFixed(0)}%
        </td>
        <td>${((c.first_attempt_success_rate || 0) * 100).toFixed(0)}%</td>
        <td>${c.recovery_rate != null ? ((c.recovery_rate || 0) * 100).toFixed(0) + '%' : 'N/A'}</td>
        <td>${c.avg_iterations != null ? c.avg_iterations.toFixed(1) : '—'}</td>
        <td>${c.mean_execution_time != null ? Utils.formatDur(c.mean_execution_time) : '—'}</td>
      </tr>
    `).join('');

    el.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:16px;margin-bottom:24px">
        <div class="metric-card" style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px">
          <div style="font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700">Suite</div>
          <div style="font-size:18px;font-weight:700;color:var(--text);margin-top:4px">${Utils.esc(suite.suite_name || 'Benchmark')}</div>
        </div>
        <div class="metric-card" style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px">
          <div style="font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700">Test Cases</div>
          <div style="font-size:22px;font-weight:700;color:var(--secondary);margin-top:4px">${cases.length}</div>
        </div>
        <div class="metric-card" style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px">
          <div style="font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700">Avg Success Rate</div>
          <div style="font-size:22px;font-weight:700;color:var(--success);margin-top:4px">${avgSuccess}</div>
        </div>
        <div class="metric-card" style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px">
          <div style="font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700">Avg Recovery Rate</div>
          <div style="font-size:22px;font-weight:700;color:var(--text);margin-top:4px">${avgRecovery}</div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Evaluation Case</th>
              <th>Task Type</th>
              <th>Library</th>
              <th>Success Rate</th>
              <th>First Attempt</th>
              <th>Recovery Rate</th>
              <th>Avg Iters</th>
              <th>Mean Time</th>
            </tr>
          </thead>
          <tbody>${caseRows}</tbody>
        </table>
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div class="alert alert-error">Failed to load evaluation summary: ${Utils.esc(e.message)}</div>`;
  }
};

Pages.runBenchmarkEvaluation = async function() {
  const btn = document.getElementById('btn-run-eval');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Running Benchmark (10 Cases)…';
  }
  const evalArea = document.getElementById('eval-area');
  if (evalArea) {
    evalArea.innerHTML = '<div class="loading-bar"><div class="loading-bar-inner"></div></div><div style="font-size:13px;color:var(--muted);text-align:center;margin-top:12px">Executing standard 10-case evaluation benchmark…</div>';
  }
  try {
    await API.post('/evaluation/run', { mode: 'local_formal', runs_per_case: 1 });
    await Pages.loadEvaluationSummary();
  } catch(e) {
    alert('Evaluation run failed: ' + e.message);
    await Pages.loadEvaluationSummary();
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-rotate" style="margin-right:8px"></i>Run Standard Benchmark (10 Cases)';
    }
  }
};
