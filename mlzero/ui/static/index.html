Pages.renderFourWayAblation = function(data) {
  const el = document.getElementById('ablation-area');
  if (!el) return;
  Pages._ablationData = data;

  const hasData = Boolean(data && data.configurations && Object.keys(data.configurations).length > 0 && data.status !== 'not_run');

  const configsMeta = [
    { key: 'LLM_ONLY', name: 'LLM Only', sem: false, epi: false },
    { key: 'LLM_SEMANTIC', name: 'LLM + Semantic Memory', sem: true, epi: false },
    { key: 'LLM_EPISODIC', name: 'LLM + Episodic Memory', sem: false, epi: true },
    { key: 'FULL_SYSTEM', name: 'Full System', sem: true, epi: true }
  ];

  const tableRows = configsMeta.map(meta => {
    const cfg = hasData && data.configurations ? data.configurations[meta.key] : null;
    const tsr = cfg && cfg.tsr ? `${cfg.tsr.value.toFixed(1)}% <span style="font-size:11px;color:var(--muted)">(${cfg.tsr.successful_runs}/${cfg.tsr.total_runs})</span>` : '—';
    const fasr = cfg && cfg.fasr ? `${cfg.fasr.value.toFixed(1)}% <span style="font-size:11px;color:var(--muted)">(${cfg.fasr.first_attempt_successful_runs}/${cfg.fasr.total_runs})</span>` : '—';
    const iters = cfg ? `${cfg.avg_iterations.toFixed(2)}${cfg.std_iterations ? ' ± ' + cfg.std_iterations.toFixed(2) : ''}` : '—';
    const recVal = cfg && cfg.error_recovery_rate ? (cfg.error_recovery_rate.value != null ? `${cfg.error_recovery_rate.value.toFixed(1)}%` : 'N/A') : '—';
    const recCounts = cfg && cfg.error_recovery_rate && cfg.error_recovery_rate.initially_failed_runs > 0 ? ` <span style="font-size:11px;color:var(--muted)">(${cfg.error_recovery_rate.recovered_runs}/${cfg.error_recovery_rate.initially_failed_runs})</span>` : '';
    const timeVal = cfg ? `${cfg.mean_execution_time_seconds.toFixed(2)}s${cfg.std_execution_time_seconds ? ' ± ' + cfg.std_execution_time_seconds.toFixed(2) + 's' : ''}` : '—';

    return `
      <tr>
        <td class="td-primary" style="font-weight:600">
          ${meta.name}
          <div style="font-size:11px;color:var(--muted);margin-top:2px">
            Semantic: <span class="badge ${meta.sem ? 'badge-success' : 'badge-neutral'}" style="font-size:10px;padding:1px 6px">${meta.sem ? 'ON' : 'OFF'}</span>
            Episodic: <span class="badge ${meta.epi ? 'badge-success' : 'badge-neutral'}" style="font-size:10px;padding:1px 6px">${meta.epi ? 'ON' : 'OFF'}</span>
          </div>
        </td>
        <td style="font-weight:700;color:${cfg && cfg.tsr && cfg.tsr.value >= 70 ? 'var(--success)' : 'var(--text)'}">${tsr}</td>
        <td>${fasr}</td>
        <td>${iters}</td>
        <td>${recVal}${recCounts}</td>
        <td>${timeVal}</td>
      </tr>
    `;
  }).join('');

  let visualComparisonHtml = '';
  if (hasData) {
    const cfgs = data.configurations;
    visualComparisonHtml = `
      <div style="margin-top:28px">
        <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px">Visual Comparative Metrics</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:16px">
          ${configsMeta.map(m => {
            const c = cfgs[m.key] || {};
            const tsr = (c.tsr && c.tsr.value) || 0;
            const fasr = (c.fasr && c.fasr.value) || 0;
            const rec = (c.error_recovery_rate && c.error_recovery_rate.value) || 0;
            return `
              <div class="panel" style="padding:16px">
                <div style="font-weight:700;color:var(--text);margin-bottom:10px;font-size:13px">${m.name}</div>
                <div style="margin-bottom:8px">
                  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:3px">
                    <span>Total Success Rate (TSR)</span>
                    <strong>${tsr.toFixed(1)}%</strong>
                  </div>
                  <div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden">
                    <div style="height:100%;width:${Math.min(100, tsr)}%;background:linear-gradient(90deg, var(--primary), var(--secondary));border-radius:3px"></div>
                  </div>
                </div>
                <div style="margin-bottom:8px">
                  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:3px">
                    <span>First-Attempt Success Rate (FASR)</span>
                    <strong>${fasr.toFixed(1)}%</strong>
                  </div>
                  <div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden">
                    <div style="height:100%;width:${Math.min(100, fasr)}%;background:linear-gradient(90deg, #8A2BE2, #00f2fe);border-radius:3px"></div>
                  </div>
                </div>
                <div>
                  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:3px">
                    <span>Recovery Rate</span>
                    <strong>${c.error_recovery_rate && c.error_recovery_rate.value != null ? rec.toFixed(1) + '%' : 'N/A'}</strong>
                  </div>
                  <div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden">
                    <div style="height:100%;width:${c.error_recovery_rate && c.error_recovery_rate.value != null ? Math.min(100, rec) : 0}%;background:linear-gradient(90deg, #28C76F, #00f2fe);border-radius:3px"></div>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  const rawRunsCount = (hasData && data.raw_runs) ? data.raw_runs.length : 0;

  el.innerHTML = `
    ${hasData ? `
      <div class="alert alert-info" style="margin-bottom:18px">
        <i class="fa-solid fa-circle-info" style="margin-right:8px"></i>
        ${Utils.esc(data.academic_integrity_statement || 'The following results were obtained from the independent paper-aligned implementation using the project local controlled benchmark suite.')}
      </div>
    ` : `
      <div class="alert alert-neutral" style="margin-bottom:18px">
        <i class="fa-solid fa-info-circle" style="margin-right:8px"></i>
        No four-way ablation experiment has been run yet. Click <strong>"Run Four-Configuration Experiment"</strong> above to execute all 4 configurations dynamically.
      </div>
    `}

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Configuration</th>
            <th>TSR</th>
            <th>FASR</th>
            <th>Avg Iterations</th>
            <th>Recovery Rate</th>
            <th>Mean Time</th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>

    ${visualComparisonHtml}

    <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;align-items:center">
      <button class="apple-btn apple-btn-secondary" ${!hasData ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''} onclick="Pages.toggleAblationRaw()">
        <i class="fa-solid fa-table-list" style="margin-right:8px"></i>View Raw Results (${rawRunsCount})
      </button>
      <button class="apple-btn apple-btn-secondary" ${!hasData ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''} onclick="Pages.downloadAblationCsv()">
        <i class="fa-solid fa-file-csv" style="margin-right:8px"></i>Download CSV
      </button>
      <button class="apple-btn apple-btn-secondary" ${!hasData ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''} onclick="Pages.downloadAblationJson()">
        <i class="fa-solid fa-file-code" style="margin-right:8px"></i>Download JSON
      </button>
    </div>

    <div id="ablation-raw-container" style="display:none;margin-top:24px"></div>
  `;
};

  container.style.display = 'block';

  const data = Pages._ablationData;
  const rawRuns = (data && data.raw_runs) ? data.raw_runs : [];

          <tr>
            <th>Case ID</th>
            <th>Config</th>

            <th>Outcome</th>
            <th>1st Attempt</th>
            <th>Iters</th>
            <th>Init Failed</th>
            <th>Recovered</th>
            <th>Time</th>
            <th>Final Decision</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
};

Pages.downloadAblationCsv = function() {
  const data = Pages._ablationData;
  if (!data || !data.configurations) return;

  const configs = [
    { key: 'LLM_ONLY', name: 'LLM Only', sem: 'OFF', epi: 'OFF' },
    { key: 'LLM_SEMANTIC', name: 'LLM + Semantic Memory', sem: 'ON', epi: 'OFF' },
    { key: 'LLM_EPISODIC', name: 'LLM + Episodic Memory', sem: 'OFF', epi: 'ON' },
    { key: 'FULL_SYSTEM', name: 'Full System', sem: 'ON', epi: 'ON' }
  ];

  let csv = 'Configuration,Semantic Memory,Episodic Memory,TSR (%),Successful Runs,Total Runs,FASR (%),First Attempt Successful Runs,Avg Iterations,Std Iterations,Error Recovery Rate (%),Recovered Runs,Initially Failed Runs,Mean Execution Time (s),Std Execution Time (s)\n';

  configs.forEach(c => {
    const d = data.configurations[c.key] || {};
    const tsr = d.tsr || {};
    const fasr = d.fasr || {};
    const rec = d.error_recovery_rate || {};
    const recVal = rec.value != null ? rec.value.toFixed(2) : 'N/A';

    csv += `"${c.name}","${c.sem}","${c.epi}",${(tsr.value || 0).toFixed(2)},${tsr.successful_runs || 0},${tsr.total_runs || 0},${(fasr.value || 0).toFixed(2)},${fasr.first_attempt_successful_runs || 0},${(d.avg_iterations || 0).toFixed(2)},${(d.std_iterations || 0).toFixed(2)},"${recVal}",${rec.recovered_runs || 0},${rec.initially_failed_runs || 0},${(d.mean_execution_time_seconds || 0).toFixed(2)},${(d.std_execution_time_seconds || 0).toFixed(2)}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'four_way_ablation_results.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

Pages.downloadAblationJson = function() {
  const data = Pages._ablationData;
  if (!data) return;

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'four_way_ablation_results.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

/* ── Sidebar Toggle ─────────────────────────────────────────────────────────── */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}

/* ── Engine Status ──────────────────────────────────────────────────────────── */
async function checkEngine() {
  const dot = document.getElementById('engine-dot');
  const label = document.getElementById('engine-label');
  const vtag = document.getElementById('version-tag');
  const mDot = document.getElementById('mobile-engine-dot');
  const mLabel = document.getElementById('mobile-engine-label');
  try {
    const h = await API.get('/health');
    if (dot) dot.className = 'engine-dot';
    if (label) label.textContent = 'Engine Ready';
    if (vtag) vtag.textContent = `v${h.version || '—'}`;
    if (mDot) mDot.className = 'engine-dot';
    if (mLabel) mLabel.textContent = 'Ready';
  } catch(e) {
    if (dot) dot.className = 'engine-dot error';
    if (label) label.textContent = 'Engine offline';
    if (mDot) mDot.className = 'engine-dot error';
    if (mLabel) mLabel.textContent = 'Offline';
  }
}

/* ── Boot ─────────────────────────────────────────────────────────────────── */
checkEngine();
Router.init();
</script>
